name: Pokemon Restock Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: restock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run restock checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          TARGET_API_KEY: ${{ secrets.TARGET_API_KEY }}
        run: python -m restock_bot.main

      - name: Commit updated restock state
        run: |
          git config user.name "restock-bot"
          git config user.email "restock-bot@users.noreply.github.com"
          git add state/seen_in_stock.json
          git diff --cached --quiet || git commit -m "Update restock state [skip ci]"
          git push

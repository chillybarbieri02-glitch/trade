<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CollectIQ - AI Accounts Receivable Assistant</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>CollectIQ</h1>
    <p class="tagline">AI-prioritized invoice collections for small businesses</p>
    <label class="upload-btn">
      Import invoices (CSV)
      <input type="file" id="csv-input" accept=".csv" hidden />
    </label>
  </header>

  <section id="dashboard" class="cards"></section>

  <section>
    <h2>Open invoices, ranked by collection risk</h2>
    <table id="invoice-table">
      <thead>
        <tr>
          <th>Risk</th>
          <th>Customer</th>
          <th>Invoice #</th>
          <th>Amount</th>
          <th>Due date</th>
          <th>Days late</th>
          <th>Stage</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="invoice-body"></tbody>
    </table>
  </section>

  <dialog id="draft-dialog">
    <h3 id="draft-title"></h3>
    <textarea id="draft-text" rows="10"></textarea>
    <div class="dialog-actions">
      <button id="copy-draft">Copy</button>
      <button id="close-dialog">Close</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
